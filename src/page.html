<!doctype html>
<!-- Generated from src/page.html by scripts/pages.mjs. Edit the template, not this file. -->
<html lang="en" data-start-mode="{{MODE}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta name="theme-color" content="#f7efe6" />

  <!-- Link previews -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Jaylee &amp; Helga’s Playground" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:image" content="{{OG_IMAGE}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="{{OG_ALT}}" />
  {{OG_URL}}
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESCRIPTION}}" />
  <meta name="twitter:image" content="{{OG_IMAGE}}" />

  <!-- Icons & home screen -->
  <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-{{ICON}}-64.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon-{{ICON}}.png" />
  <link rel="manifest" href="{{MANIFEST}}" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="collar" aria-hidden="true"></span>
      <div>
        <h1 id="title">Jaylee's Playground</h1>
        <p class="sub"><span id="mood-who">Jaylee</span> is feeling <strong id="mood">Happy</strong></p>
      </div>
    </div>
    <div class="dog-switch" role="radiogroup" aria-label="Which dogs are in the yard">
      <button type="button" role="radio" data-mode="jaylee" aria-checked="true">Jaylee</button>
      <button type="button" role="radio" data-mode="helga" aria-checked="false">Helga</button>
      <button type="button" role="radio" data-mode="both" aria-checked="false">Both</button>
    </div>
    <div class="meters" aria-label="How the selected dog is feeling">
      <div class="meter" id="m-energy" style="--v:.8"><span>Energy</span><i></i></div>
      <div class="meter" id="m-happy" style="--v:.8"><span>Happiness</span><i></i></div>
      <div class="meter cool" id="m-cool" style="--v:.6"><span>Cool</span><i></i></div>
    </div>
  </header>

  <main class="layout">
    <section class="stage-wrap" aria-label="The playground">
      <canvas id="stage" role="img" aria-label="Dogs playing in a backyard with a pool"></canvas>
      <div class="status" id="status" aria-live="polite">Hi!</div>
      <button type="button" class="time-toggle" id="time" aria-label="Time of day: follows your clock">
        <svg class="i-auto" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <svg class="i-day" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
        <svg class="i-night" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
        <span id="time-label">Auto</span>
      </button>
      <p class="hint">Tap the lawn to call · tap the pool to swim · tap a dog to pet (and pick them)</p>
    </section>

    <section class="controls" aria-label="Play">
      <div class="group">
        <button class="btn primary" data-act="ball">Throw ball</button>
        <button class="btn primary" data-act="treat">Give treat</button>
        <button class="btn primary" data-act="swim">Go swim</button>
        <button class="btn primary" data-act="tug">Tug rope</button>
        <button class="btn primary pair" data-act="play" data-pair hidden>Play together</button>
        <button class="btn primary pair" data-act="tugFriend" data-pair hidden>Tug-of-war</button>
        <button class="btn pair" data-act="greet" data-pair hidden>Say hi to friend</button>
      </div>
      <div class="group">
        <button class="btn" data-act="sit">Sit</button>
        <button class="btn" data-act="wave">Wave</button>
        <button class="btn" data-act="hop">Hop</button>
        <button class="btn" data-act="wink">Wink</button>
        <button class="btn" data-act="look">Look around</button>
        <button class="btn" data-act="zoomies">Zoomies</button>
        <button class="btn" data-act="sleep">Nap</button>
      </div>
      <label class="toggle">
        <input type="checkbox" id="roam" checked />
        <span class="track" aria-hidden="true"></span>
        Let them decide
      </label>
    </section>

    <section class="chat" aria-label="Chat with the dogs">
      <header class="chat-head">
        <span class="collar small" aria-hidden="true"></span>
        <div>
          <h2 id="chat-title">Talk to Jaylee</h2>
          <p>They'll answer, and might do what you ask</p>
        </div>
        <label class="who">
          <span>I'm</span>
          <select id="human" aria-label="Who's chatting">
            <option value="gabby">Gabby</option>
            <option value="shannah">Shannah</option>
            <option value="guest">a guest</option>
          </select>
        </label>
      </header>
      <ol class="chat-log" id="chat-log" aria-live="polite"></ol>
      <form class="chat-form" id="chat-form" autocomplete="off">
        <input id="chat-input" name="message" maxlength="500" placeholder="Say something…" aria-label="Message to the dogs" />
        <button class="btn primary" type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer id="stats">0 fetches · 0 swims · 0 pets · 0 treats</footer>

  <script type="module" src="/dist/main.js"></script>
</body>
</html>
