<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Jaylee's Playground</title>
  <meta name="description" content="A virtual backyard and pool for Jaylee the pup. She has a mind of her own." />
  <meta name="theme-color" content="#f7efe6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="collar" aria-hidden="true"></span>
      <div>
        <h1>Jaylee's Playground</h1>
        <p class="sub">Feeling <strong id="mood">Happy</strong></p>
      </div>
    </div>
    <div class="meters" aria-label="How Jaylee is feeling">
      <div class="meter" id="m-energy" style="--v:.8"><span>Energy</span><i></i></div>
      <div class="meter" id="m-happy" style="--v:.8"><span>Happiness</span><i></i></div>
      <div class="meter cool" id="m-cool" style="--v:.6"><span>Cool</span><i></i></div>
    </div>
  </header>

  <main>
    <section class="stage-wrap" aria-label="Jaylee's playground">
      <canvas id="stage" role="img" aria-label="Jaylee playing in her backyard with a pool"></canvas>
      <div class="status" id="status" aria-live="polite">Hi! I'm Jaylee</div>
      <p class="hint">Tap the lawn to call her · tap the pool to swim · tap Jaylee to pet</p>
    </section>

    <section class="controls" aria-label="Play with Jaylee">
      <div class="group">
        <button class="btn primary" data-act="ball">Throw ball</button>
        <button class="btn primary" data-act="treat">Give treat</button>
        <button class="btn primary" data-act="swim">Go swim</button>
      </div>
      <div class="group">
        <button class="btn" data-act="sit">Sit</button>
        <button class="btn" data-act="wave">Wave</button>
        <button class="btn" data-act="hop">Hop</button>
        <button class="btn" data-act="wink">Wink</button>
        <button class="btn" data-act="look">Look around</button>
        <button class="btn" data-act="zoomies">Zoomies</button>
      </div>
      <label class="toggle">
        <input type="checkbox" id="roam" checked />
        <span class="track" aria-hidden="true"></span>
        Let her decide
      </label>
    </section>
  </main>

  <footer id="stats">0 fetches · 0 swims · 0 pets · 0 treats</footer>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
